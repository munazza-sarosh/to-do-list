<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" id="todotext" name="todotext" placeholder="enter task">
    <span id="demo"></span>
    <script>
        let addtask = document.getElementById("todotext")
        let display = document.getElementById("demo")
        let ul = document.createElement("ul")
        addtask.addEventListener("keydown", add) // addeventlistener(event,function)
        function add(event) {
            console.log(event);
            if (event.keyCode === 13) {
                display.innerHTML = addtask.value;
                let input = document.createElement("input")
                input.type = "checkbox"
                let edit = document.createElement("button")
                let delete_ = document.createElement("button")

                let li = document.createElement("li")
                li.appendChild(input)
                // li.appendChild(display)
                li.appendChild(edit)
                li.appendChild(delete_)
                li.appendChild(document.createTextNode(" " + display))
                ul.appendChild(li)
                addtask.value = ""
            }
        }
        document.body.appendChild(ul)
    </script>
</body>

</html>
