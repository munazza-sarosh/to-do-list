<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to do list</title>
</head>

<body>
    <input type="text" id="todotext" name="todotext" placeholder="enter task">
    <span id="demo"></span>

    <!-- <button type="reset" id="delete" name="delete">delete</button>
    <button type="submit" id="edit" name="edit">edit</button> -->
    <script>

        let addtask = document.getElementById("todotext")
        let display = document.getElementById("demo")

        let ul = document.createElement("ul")
        addtask.addEventListener("keydown", add)
        function add(event) {

            console.log(event);

            if (event.key === "Enter") {

                let input = document.createElement("input")
                input.type = "checkbox"

                let taskText = document.createElement("span")
                taskText.textContent = "" + addtask.value + ""

                let deleteBtn = document.createElement("button")
                deleteBtn.textContent = "delete"

                let editBtn = document.createElement("button")
                editBtn.textContent = "edit"

                let li = document.createElement("li")

                li.appendChild(input)
                li.appendChild(taskText)
                li.appendChild(deleteBtn)
                li.appendChild(editBtn)
                // li.appendChild(display)

                // li.appendChild(document.createTextNode(" " + addtask.value))
                ul.appendChild(li)

                addtask.value = ""
                deleteBtn.addEventListener("click", function () {
                    li.remove()
                })

                editBtn.addEventListener("click", function () {
                    let newTask = prompt("Edit your task:", taskText.textContent)

                    if (newTask !== null && newTask !== "") {
                        taskText.textContent = " " + newTask + " "
                    }
                })
            }
        }
        document.body.appendChild(ul)
    </script>
</body>

</html>
