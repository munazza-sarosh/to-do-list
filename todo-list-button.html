<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fields {
            width: 420px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #todo-5 {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        #todo-5:focus {
            border-color: #4f46e5;
        }

        #click-5 {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        #click-5:hover {
            background: #3730a3;
        }

        #task5 {
            margin-top: 20px;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            background: #f8f9ff;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            color: #333;
        }

        li input[type="checkbox"] {
            width: 17px;
            height: 17px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="fields" id="five">

        <h1>My Todo List</h1>

        <div class="input-area">
            <input type="text" id="todo-5" name="todo-5" placeholder="Enter a task">

            <button id="click-5" type="button">
                Add Task
            </button>
        </div>

        <p id="task5"></p>

    </div>

    <script>
        let btn5 = document.getElementById("click-5")
        btn5.addEventListener('click', doagain5)

        let text_ = document.getElementById("five")
        let display5 = document.getElementById("task5")
        let ul_ = document.createElement("ul")

        function doagain5() {

            let addtask_ = document.getElementById("todo-5")
            let value = addtask_.value;

            let li = document.createElement("li")
            let input = document.createElement("input")

            input.type = "checkbox"
            li.appendChild(input)

            li.appendChild(document.createTextNode(" " + value))
            ul_.appendChild(li)
            text_.appendChild(ul_)

            addtask_.value = " ";
        }

        document.body.appendChild(display5)
    </script>

</body>

</html>
